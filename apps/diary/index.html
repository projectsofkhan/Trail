<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ALL YOUR EXISTING CSS STYLES REMAIN THE SAME */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #333333;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-container {
            width: 340px;
            height: 680px;
            background-color: #1a1a1a;
            border-radius: 30px;
            padding: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 25px;
            background-color: #1a1a1a;
            border-radius: 0 0 15px 15px;
            z-index: 10;
        }

        .screen {
            width: 100%;
            height: calc(100% - 16px);
            background-color: #000;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 11px;
            font-weight: 500;
            padding: 0 15px;
            height: 35px;
            background-color: rgba(0, 0, 0, 0.2);
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 3;
        }

        .status-bar .left-icons, .status-bar .right-icons { 
            display: flex; 
            align-items: center; 
        }

        .status-bar span { 
            margin-right: 8px; 
        }

        .status-bar .center-text { 
            font-size: 12px; 
            font-weight: 500; 
        }

        .app-page {
            flex: 1;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            display: flex;
            flex-direction: column;
            margin-top: 35px;
            height: calc(100% - 35px);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(139, 0, 0, 0.95);
            color: #FFD700;
            height: 50px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .back-button {
            background: none;
            border: none;
            color: #FFD700;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 8px 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-button:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .back-button:active {
            transform: scale(0.95);
            background: rgba(255, 215, 0, 0.2);
        }

        .app-title {
            font-weight: 600;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .diary-container {
            flex: 1;
            padding: 20px;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            animation: fadeIn 0.5s ease;
        }

        .page-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 5px solid #8B0000;
            animation: fadeInUp 0.5s ease;
        }

        .page-item.locked {
            background: rgba(150, 150, 150, 0.8);
            cursor: not-allowed;
            opacity: 0.6;
            border-left: 5px solid #444;
        }

        .page-item.locked .page-number {
            color: #666;
        }

        .page-item.locked .page-title {
            color: #666;
        }

        .page-item:active:not(.locked) {
            transform: scale(0.98);
        }

        .page-number {
            font-size: 32px;
            font-weight: bold;
            color: #8B0000;
            margin-bottom: 5px;
            font-family: 'Georgia', serif;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .home-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-transition {
            animation: fadeOut 0.3s ease;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .fade-in-item {
            animation: fadeInUp 0.4s ease forwards;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="notch"></div>
        <div class="screen">
            <div class="status-bar">
                <div class="left-icons">
                    <span>◇</span>
                    <span id="current-time">1:37</span>
                </div>
                <div class="center-text">Diary</div>
                <div class="right-icons">
                    <span>📶</span>
                    <span>🔋</span>
                </div>
            </div>

            <div class="app-page">
                <div class="app-header">
                    <button class="back-button" onclick="closeAppAndReturnHome()">←</button>
                    <div class="app-title">Diary</div>
                    <div style="width: 40px;"></div>
                </div>

                <div class="diary-container">
                    <div class="pages-grid" id="pagesGrid">
                        <div class="page-item" id="page1-item" onclick="openPage('page1')">
                            <div class="page-number">01</div>
                            <div class="page-title">Page 01</div>
                        </div>
                        <div class="page-item locked" onclick="openLockedPage()">
                            <div class="page-number">02</div>
                            <div class="page-title">Page 02</div>
                        </div>
                        <div class="page-item locked" onclick="openLockedPage()">
                            <div class="page-number">03</div>
                            <div class="page-title">Page 03</div>
                        </div>
                        <div class="page-item locked" onclick="openLockedPage()">
                            <div class="page-number">04</div>
                            <div class="page-title">Page 04</div>
                        </div>
                        <div class="page-item locked" onclick="openLockedPage()">
                            <div class="page-number">05</div>
                            <div class="page-title">Page 05</div>
                        </div>
                        <div class="page-item locked" onclick="openLockedPage()">
                            <div class="page-number">06</div>
                            <div class="page-title">Page 06</div>
                        </div>
                        <div class="page-item locked" onclick="openLockedPage()">
                            <div class="page-number">07</div>
                            <div class="page-title">Page 07</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="home-bar"></div>
    </div>

    <script>
// ✅ CHECK IF TASK 6 IS COMPLETED
function isTask6Completed() {
    // Check localStorage for task completion status
    const task6Completed = localStorage.getItem('task6_completed');
    
    console.log('📖 Checking Task 6 completion:', task6Completed);
    
    if (task6Completed === 'true' || task6Completed === true) {
        console.log('✅ Task 6 IS completed');
        return true;
    }
    
    // Also check taskProgress storage
    const taskProgress = JSON.parse(localStorage.getItem('taskProgress') || '{}');
    console.log('📖 Task Progress data:', taskProgress);
    
    if (taskProgress['task6_unlock_instashan'] === true) {
        console.log('✅ Task 6 IS completed (from taskProgress)');
        // Sync it to task6_completed for consistency
        localStorage.setItem('task6_completed', 'true');
        return true;
    }
    
    console.log('❌ Task 6 is NOT completed');
    return false;
}

// Apply lock/unlock status based on Task 6 completion
function applyPageLockStatus() {
    const page1Item = document.getElementById('page1-item');
    
    if (isTask6Completed()) {
        // Task 6 is completed - Page 1 should be unlocked
        page1Item.classList.remove('locked');
        page1Item.style.cursor = 'pointer';
        page1Item.onclick = function() { 
            openPage('page1');
        };
        console.log('✅ Page 1 unlocked - Task 6 completed');
    } else {
        // Task 6 is NOT completed - Page 1 should be locked
        page1Item.classList.add('locked');
        page1Item.style.cursor = 'not-allowed';
        page1Item.onclick = function() { 
            openLockedPage();
        };
        console.log('🔒 Page 1 locked - Task 6 not completed');
    }
}

// Open locked page (for all locked pages)
function openLockedPage() {
    const pagesGrid = document.getElementById('pagesGrid');
    if (pagesGrid) {
        pagesGrid.classList.add('page-transition');
    }
    setTimeout(() => {
        window.location.href = 'https://projectsofkhan.github.io/Trail/apps/diary/lockedpage.html';
    }, 200);
}

// Open specific page (only for unlocked pages)
function openPage(pageNumber) {
    // Always double-check before opening
    if (pageNumber === 'page1' && !isTask6Completed()) {
        console.log('⚠️ Double-check failed: Task 6 not completed');
        openLockedPage();
        return;
    }
    
    const pagesGrid = document.getElementById('pagesGrid');
    if (pagesGrid) {
        pagesGrid.classList.add('page-transition');
    }
    
    setTimeout(() => {
        if (pageNumber === 'page1') {
            // Redirect to actual page 1
            window.location.href = 'https://projectsofkhan.github.io/Trail/apps/diary/page1.html';
        } else {
            openLockedPage();
        }
    }, 200);
}

// Listen for storage changes (when TaskProgress updates localStorage)
function setupStorageListener() {
    window.addEventListener('storage', function(event) {
        console.log('📡 Storage event detected:', event.key, '=', event.newValue);
        
        if (event.key === 'task6_completed' || event.key === 'taskProgress') {
            console.log('🔄 Task status changed, updating page lock status...');
            setTimeout(() => {
                applyPageLockStatus();
            }, 100);
        }
    });
    
    // Also check for message events from TaskProgress
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'DIARY_UNLOCKED') {
            console.log('📨 Received DIARY_UNLOCKED message from TaskProgress');
            localStorage.setItem('task6_completed', 'true');
            applyPageLockStatus();
        }
    });
}

/**
 * Back Button - Closes app tab and returns to home
 */
function initializeBackButton() {
    const backButton = document.querySelector('.back-button');

    if (backButton) {
        backButton.addEventListener('click', function(e) {
            e.preventDefault();
            closeAppAndReturnHome();
        });
    }

    window.addEventListener('popstate', function() {
        closeAppAndReturnHome();
    });

    window.onkeydown = function(e) {
        if (e.key === 'Escape') {
            closeAppAndReturnHome();
        }
    };
}

function closeAppAndReturnHome() {
    console.log('🔙 Closing Diary and returning to home...');

    if (window.opener && !window.opener.closed) {
        try {
            window.opener.focus();
            console.log('✅ Home tab focused');
        } catch (error) {
            console.log('⚠️ Could not focus home tab');
        }
    }

    setTimeout(() => {
        window.close();
    }, 50);
}

function initializeAutoRedirect() {
    window.addEventListener('beforeunload', function() {
        console.log('🔄 Diary closing - redirecting to home...');

        if (window.opener && !window.opener.closed) {
            try {
                window.opener.location.href = window.location.origin + '/Trail/';
                console.log('✅ Home tab redirected!');
            } catch (error) {
                console.log('⚠️ Could not redirect, focusing home tab...');
                try {
                    window.opener.focus();
                } catch (focusError) {
                    console.log('❌ Could not focus home tab');
                }
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', function() {
    const pagesGrid = document.getElementById('pagesGrid');
    const currentTimeElement = document.getElementById('current-time');

    // Update time
    function updateTime() {
        if (currentTimeElement) {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            currentTimeElement.textContent = `${hours}:${minutes}`;
        }
    }

    updateTime();
    setInterval(updateTime, 60000);

    // Apply lock/unlock status for pages
    applyPageLockStatus();
    
    // Setup storage listener to detect when Task 6 completes
    setupStorageListener();

    // Add fade animations to page items
    if (pagesGrid) {
        const pageItems = pagesGrid.querySelectorAll('.page-item');
        pageItems.forEach((item, index) => {
            item.style.animationDelay = `${index * 0.1}s`;
        });
    }

    // Initialize back button and auto-redirect
    initializeBackButton();
    initializeAutoRedirect();

    console.log('📖 Diary App Ready - Checking Task 6 completion');
    console.log('📖 Current task6_completed status:', localStorage.getItem('task6_completed'));
});

function nextPage() {
    window.location.href = 'https://projectsofkhan.github.io/Trail/apps/diary/lockedpage.html';
}

function prevPage() {
    window.location.href = 'https://projectsofkhan.github.io/Trail/apps/diary/lockedpage.html';
}

// Debug function - can be called from console
window.debugTask6Status = function() {
    console.log('🔍 DEBUG TASK 6 STATUS:');
    console.log('localStorage task6_completed:', localStorage.getItem('task6_completed'));
    console.log('localStorage taskProgress:', JSON.parse(localStorage.getItem('taskProgress') || '{}'));
    console.log('Is task6 completed?', isTask6Completed());
};

// Make functions global
window.openPage = openPage;
window.openLockedPage = openLockedPage;
window.nextPage = nextPage;
window.prevPage = prevPage;
window.isTask6Completed = isTask6Completed;
window.applyPageLockStatus = applyPageLockStatus;

    </script>
</body>
</html>
