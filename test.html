<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Home Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <div class="phone-container">
        <!-- Video Background -->
        <div class="video-background">
            <video autoplay muted loop playsinline id="bg-video" preload="auto" webkit-playsinline>
                <source src="backgroundvideo.mp4" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>
            <div class="video-overlay"></div>
        </div>

        <!-- Pull Down Control Panel -->
        <div class="control-panel" id="controlPanel">
            <div class="panel-header">
                <div class="panel-title">Quick Controls</div>
                <button class="close-panel" onclick="closeControlPanel()">✕</button>
            </div>
            <div class="music-controls">
                <button class="music-control-btn" onclick="toggleMusic()">
                    <span class="control-icon">🎵</span>
                    <span class="control-text" id="musicToggleText">Turn On Music</span>
                    <div class="status-indicator off" id="musicStatusIndicator"></div>
                </button>

                <button class="music-control-btn" onclick="playMusicOne()">
                    <span class="control-icon">▶️</span>
                    <span class="control-text">Play Music One</span>
                </button>

                <button class="music-control-btn" onclick="playMusicTwo()">
                    <span class="control-icon">▶️</span>
                    <span class="control-text">Play Music Two</span>
                </button>
            </div>
        </div>

        <div class="notch"></div>
        <div class="screen">
            <div class="status-bar" id="statusBar">
                <div class="left-icons">
                    <span id="current-time">1:37</span>
                </div>
                <div class="center-text"></div>
                <div class="right-icons">
                    <span>📶</span>
                    <span>🔋</span>
                </div>
            </div>

            <div class="home-screen">
                <div class="app-grid" id="appGrid"></div>
            </div>
        </div>

        <div class="home-bar"></div>
    </div>

    <!-- Background Music Elements -->
    <audio id="bgMusic1" loop>
        <source src="https://projectsofkhan.github.io/Trail/sounds/bgmusic.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic2" loop>
        <source src="https://projectsofkhan.github.io/Trail/sounds/bgmusic2.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
    
    <!-- Inline JavaScript for Video Playback -->
    <script>
        // Video autoplay fix
        function startVideoPlayback() {
            const video = document.getElementById('bg-video');
            
            if (video) {
                console.log('🎥 Video element found, trying to play...');
                
                // Try to play immediately
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('✅ Video playback started successfully');
                    }).catch(error => {
                        console.log('⚠️ Autoplay blocked:', error);
                        
                        // Try muted play (browsers allow muted autoplay)
                        video.muted = true;
                        video.play().then(() => {
                            console.log('✅ Video playing (muted)');
                            // Unmute after starting
                            setTimeout(() => {
                                video.muted = false;
                                console.log('✅ Video unmuted');
                            }, 1000);
                        }).catch(e => {
                            console.log('❌ Muted play also blocked:', e);
                        });
                    });
                }
            } else {
                console.log('❌ Video element not found!');
            }
        }

        // Start video when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 DOM loaded, starting video...');
            startVideoPlayback();
            
            // Also try on user interaction
            document.addEventListener('click', function() {
                const video = document.getElementById('bg-video');
                if (video && video.paused) {
                    console.log('🖱️ User clicked, trying to play video...');
                    video.play().catch(e => console.log('Click play failed:', e));
                }
            }, { once: true }); // Only try once
            
            // Debug: Add a test button
            const debugDiv = document.createElement('div');
            debugDiv.style.cssText = 'position:fixed;top:10px;right:10px;background:#000;color:#fff;padding:10px;border-radius:5px;z-index:9999;font-size:12px;';
            debugDiv.innerHTML = `
                <button onclick="startVideoPlayback()" style="background:#4CAF50;color:white;border:none;padding:5px 10px;border-radius:3px;margin:5px;">▶ Play Video</button>
                <button onclick="location.reload()" style="background:#2196F3;color:white;border:none;padding:5px 10px;border-radius:3px;margin:5px;">↻ Reload</button>
            `;
            document.body.appendChild(debugDiv);
        });

        // Fallback: Try again after 2 seconds
        setTimeout(startVideoPlayback, 2000);
        
        // Expose function globally for debug button
        window.startVideoPlayback = startVideoPlayback;
    </script>
</body>
</html>
